name: Build 5G Switcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd extracted/NetworkSwitcher
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: 5G-Switcher-APK
          path: extracted/NetworkSwitcher/app/build/outputs/apk/debug/app-debug.apk
